[project]
name = "wayback"
version = "0.1.2a0"
description = "A wrapper for collecting data from the Wayback Machine"
authors = [
    {name = "Ronald E. Robertson", email = "rer@acm.org"}
]
requires-python = ">=3.11"
dependencies = [
    "waybackpy",
    "requests",
    "pandas",
    "tqdm",
]
readme = "README.md"

[project.urls]
repository = "https://github.com/gitronald/wayback"

# proj-template release stamp, set by proj-init.sh and install-template; inert to consumers.
[tool.proj-template]
version = "0.11.7"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs; a leading "/" anchors each path to the root.
# hatchling always adds pyproject.toml, PKG-INFO, and .gitignore, so keep secrets out of them.
only-include = [
    "/wayback",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly>=1.3.2",
    "pytest>=9.1.1",
    "pytest-cov",
    # Same minor as the ruff-pre-commit rev in .pre-commit-config.yaml; bump the two together.
    "ruff>=0.17,<0.18",
]

[tool.ruff]
target-version = "py311"
# ruff formats Python fences in Markdown; keep it off plans and the changelog.
extend-exclude = [".planners/", "CHANGELOG.md"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]

# tests/ stays type-checked, but unannotated pytest fixture params don't fail implicit-any.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["wayback"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 42
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
